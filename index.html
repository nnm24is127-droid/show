<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expo Sales Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sales Tracker">
<meta name="theme-color" content="#0f4c5c">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f2;--card:#fff;--ink:#16252b;--mute:#66767c;--line:#dde2de;--brand:#0f4c5c;--on:#fff;--acc:#e36414;--ok:#2a8a5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a1e;--card:#18262b;--ink:#e8eeee;--mute:#8da0a6;--line:#2a3c42;--brand:#5fb3c6;--on:#0b1c21;--acc:#ff8a3d;--ok:#4cc38a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:76px}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:22px;font-weight:800;margin:4px 0 2px}h2{font-size:16px;margin:18px 0 8px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:14px 4px;font:600 14px inherit;font-family:inherit}
nav button.on{color:var(--brand);box-shadow:inset 0 3px var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.big{font-size:26px;font-weight:800}.mute{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.b{background:var(--brand);color:var(--on);border:0;border-radius:8px;padding:10px 14px;font:600 14px inherit;font-family:inherit}
button.g{background:none;color:var(--brand);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:600 13px inherit;font-family:inherit}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.steps{display:flex;gap:3px;margin:10px 0 4px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.d{background:var(--ok)}.steps i.c{background:var(--acc)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line)}
.tag.o{background:var(--acc);color:#fff}.tag.k{background:var(--ok);color:#fff}
select,input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:3px 0 10px}
label{font-size:13px;font-weight:600}
dialog{border:0;border-radius:12px;padding:16px;width:min(94vw,460px);background:var(--card);color:var(--ink);max-height:88vh}
dialog::backdrop{background:#0008}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.scroll{overflow-x:auto}
body.ro .acts{display:none}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<script>
var STAGES=['Order confirmed','Packed','Dispatched','In transit','Delivered','Placed with end consumer'];
var S={expos:[],leads:[],orders:[]},tab='dash',fExpo='';
var lastSaved={},db=null,mode='Connecting…',COLS=['expos','leads','orders'];
function loadLocal(){try{var raw=localStorage.getItem('expo-tracker');if(raw)S=JSON.parse(raw)}catch(e){}}
function save(){
 if(!db){try{localStorage.setItem('expo-tracker',JSON.stringify(S))}catch(e){}return}
 COLS.forEach(function(c){
  var ids={};
  S[c].forEach(function(x){ids[x.id]=1;var j=JSON.stringify(x);if(lastSaved[c+x.id]!==j){lastSaved[c+x.id]=j;var d=Object.assign({},x);delete d.id;db.collection(c).doc(x.id).set(d).catch(function(){mode='Could not save. Ask the owner for edit access.';render()})}});
  Object.keys(lastSaved).forEach(function(k){if(k.indexOf(c)==0){var id=k.slice(c.length);if(!ids[id]){delete lastSaved[k];db.collection(c).doc(id).delete().catch(function(){})}}});
 });
}
var CFG={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT.firebaseapp.com",projectId:"PASTE_PROJECT_ID",appId:"PASTE_APP_ID"};
var EDITOR_EMAIL="editor@example.com";
var subbed=false;
function signOut(){firebase.auth().signOut().then(function(){location.reload()})}
function showLogin(msg){
 var d=$('dlg');d.oncancel=function(e){e.preventDefault()};
 d.innerHTML='<h2 style="margin-top:0">Sign in</h2><label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><div class="mute" style="color:var(--acc)">'+esc(msg||'')+'</div><div class="acts"><button class="b" id="ls">Sign in</button></div>';
 if(!d.open)d.showModal();
 $('ls').onclick=function(){firebase.auth().signInWithEmailAndPassword($('le').value.trim(),$('lp').value).then(function(){d.close()}).catch(function(){showLogin('Wrong email or password')})}
}
function init(){
 if(!window.firebase||CFG.apiKey.indexOf('PASTE')==0){mode='Setup needed: fill the Firebase details in index.html';loadLocal();render();return}
 firebase.initializeApp(CFG);
 firebase.auth().onAuthStateChanged(function(u){
  if(!u){showLogin();return}
  db=firebase.firestore();
  var ed=(u.email||'').toLowerCase()===EDITOR_EMAIL.toLowerCase();
  document.body.classList.toggle('ro',!ed);
  mode=ed?'Live · you can edit':'Live · view only';
  if(!subbed){subbed=true;COLS.forEach(function(c){db.collection(c).onSnapshot(function(snap){
   S[c]=snap.docs.map(function(d){var o=Object.assign({},d.data(),{id:d.id});lastSaved[c+d.id]=JSON.stringify(o);return o}).sort(function(x,y){return x.id<y.id?-1:1});
   render();
  },function(){mode='Could not load data. Check sign-in.';render()})})}
  render();
 });
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().slice(0,10)}
function expo(id){return S.expos.find(function(e){return e.id==id})||{name:'—'}}
function lead(id){return S.leads.find(function(l){return l.id==id})||{name:'—'}}
function total(o){return o.qty*o.price}

function form(title,fields,vals,onSave){
  var h='<h2 style="margin-top:0">'+title+'</h2>';
  fields.forEach(function(f){
    var v=vals[f.k]==null?'':vals[f.k];
    h+='<label>'+f.l+'</label>';
    if(f.o){h+='<select id="f_'+f.k+'">'+(f.o.length?'':'<option value="">None yet</option>')+f.o.map(function(o){var val=o.v!=null?o.v:o,t=o.t||o;return'<option value="'+esc(val)+'"'+(val==v?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>'}
    else if(f.t=='area')h+='<textarea id="f_'+f.k+'" rows="2">'+esc(v)+'</textarea>';
    else h+='<input id="f_'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(v)+'"'+(f.t=='number'?' inputmode="decimal"':'')+'>';
  });
  h+='<div class="acts"><button class="b" id="fs">Save</button><button class="g" id="fc">Cancel</button></div>';
  var d=$('dlg');d.innerHTML=h;d.showModal();
  $('fc').onclick=function(){d.close()};
  $('fs').onclick=function(){
    var out={};fields.forEach(function(f){var x=$('f_'+f.k).value;out[f.k]=f.t=='number'?Number(x)||0:x});
    for(var i=0;i<fields.length;i++){if(fields[i].r&&!out[fields[i].k]){$('f_'+fields[i].k).focus();return}}
    onSave(out);save();d.close();render();
  };
}

function addExpo(){form('New expo',[{k:'name',l:'Expo name',r:1},{k:'city',l:'City'},{k:'date',l:'Date',t:'date'},{k:'cost',l:'Stall cost (₹)',t:'number'}],{date:today()},function(v){v.id=uid();S.expos.push(v)})}
function leadFields(){return[{k:'expo',l:'Expo',o:S.expos.map(function(e){return{v:e.id,t:e.name}}),r:1},{k:'name',l:'Contact name',r:1},{k:'company',l:'Company / shop'},{k:'phone',l:'Phone',t:'tel'},{k:'city',l:'City'},{k:'interest',l:'Interested in'},{k:'notes',l:'Notes',t:'area'}]}
function addLead(l){
  if(!S.expos.length){addExpo();return}
  form(l?'Edit lead':'New lead',leadFields(),l||{expo:fExpo||S.expos[0].id},function(v){if(l)Object.assign(l,v);else{v.id=uid();v.date=today();S.leads.push(v)}})
}
function orderFields(){return[{k:'lead',l:'Customer (lead)',o:S.leads.map(function(l){return{v:l.id,t:l.name+(l.company?' – '+l.company:'')}}),r:1},{k:'product',l:'Product',r:1},{k:'qty',l:'Quantity',t:'number',r:1},{k:'list',l:'List price per unit (₹)',t:'number'},{k:'price',l:'Final agreed price per unit (₹)',t:'number',r:1},{k:'terms',l:'Payment terms'},{k:'dest',l:'Delivery location'}]}
function addOrder(o,leadId){
  if(!S.leads.length){addLead();return}
  var vals=o||{lead:leadId||S.leads[0].id,qty:1};
  form(o?'Edit order':'New order',orderFields(),vals,function(v){if(o)Object.assign(o,v);else{v.id=uid();v.stage=0;v.log=[{s:0,d:today()}];v.tr={};S.orders.push(v)}})
}
function transport(o){
  form('Transport details',[{k:'carrier',l:'Transporter'},{k:'lr',l:'LR / tracking no.'},{k:'vehicle',l:'Vehicle no.'},{k:'dispatch',l:'Dispatch date',t:'date'},{k:'eta',l:'Expected delivery',t:'date'},{k:'freight',l:'Freight cost (₹)',t:'number'},{k:'consumer',l:'End consumer / site'}],o.tr||{},function(v){o.tr=v})
}
function advance(id){var o=S.orders.find(function(x){return x.id==id});if(o.stage<5){o.stage++;o.log.push({s:o.stage,d:today()});save();render();if(o.stage==2&&!o.tr.carrier)transport(o)}}
function back(id){var o=S.orders.find(function(x){return x.id==id});if(o.stage>0){o.log.pop();o.stage--;save();render()}}
function del(arr,id,msg){if(confirm(msg)){S[arr]=S[arr].filter(function(x){return x.id!=id});if(arr=='leads')S.orders=S.orders.filter(function(o){return o.lead!=id});save();render()}}

function expoFilter(){
  return '<select id="ef" onchange="fExpo=this.value;render()"><option value="">All expos</option>'+S.expos.map(function(e){return'<option value="'+e.id+'"'+(e.id==fExpo?' selected':'')+'>'+esc(e.name)+'</option>'}).join('')+'</select>'
}

function dash(){
  var rev=0,pend=0;S.orders.forEach(function(o){rev+=total(o);if(o.stage<5)pend+=total(o)});
  var h='<h1>Expo sales tracker</h1><p class="sub">From stall visit to end consumer</p><div class="grid">'
   +'<div class="card"><div class="big">'+S.leads.length+'</div><div class="mute">Leads collected</div></div>'
   +'<div class="card"><div class="big">'+S.orders.length+'</div><div class="mute">Orders won</div></div>'
   +'<div class="card"><div class="big">'+inr(rev)+'</div><div class="mute">Order value</div></div>'
   +'<div class="card"><div class="big">'+inr(pend)+'</div><div class="mute">Not yet placed with consumer</div></div></div>';
  h+='<h2>Orders by stage</h2><div class="card">'+STAGES.map(function(s,i){var n=S.orders.filter(function(o){return o.stage==i}).length;return'<div class="row" style="padding:4px 0"><span>'+s+'</span><b>'+n+'</b></div>'}).join('')+'</div>';
  h+='<h2>Expo performance</h2>';
  if(!S.expos.length)h+='<div class="card empty">Add your first expo to start collecting leads.<div class="acts" style="justify-content:center"><button class="b" onclick="addExpo()">Add expo</button></div></div>';
  else{
    h+='<div class="card scroll"><table><tr><th>Expo</th><th>Leads</th><th>Orders</th><th>Sales</th><th>Stall cost</th></tr>';
    S.expos.forEach(function(e){
      var ls=S.leads.filter(function(l){return l.expo==e.id}).map(function(l){return l.id});
      var os=S.orders.filter(function(o){return ls.indexOf(o.lead)>-1});
      var v=os.reduce(function(a,o){return a+total(o)},0);
      h+='<tr><td>'+esc(e.name)+'<div class="mute">'+esc(e.city||'')+' '+esc(e.date||'')+'</div></td><td>'+ls.length+'</td><td>'+os.length+'</td><td>'+inr(v)+'</td><td>'+inr(e.cost)+'</td></tr>';
    });
    h+='</table></div><div class="acts"><button class="g" onclick="addExpo()">Add expo</button></div>';
  }
  return h;
}

function leads(){
  var list=S.leads.filter(function(l){return!fExpo||l.expo==fExpo});
  var h='<h1>Leads</h1><p class="sub">Collected at your stalls</p>'+(S.expos.length?expoFilter():'')+'<div class="acts" style="margin:0 0 12px"><button class="b" onclick="addLead()">Add lead</button><button class="g" onclick="addExpo()">Add expo</button></div>';
  if(!list.length)return h+'<div class="empty">No leads yet. Add the first visitor from your stall.</div>';
  list.slice().reverse().forEach(function(l){
    var has=S.orders.some(function(o){return o.lead==l.id});
    h+='<div class="card"><div class="row"><b>'+esc(l.name)+'</b>'+(has?'<span class="tag k">Ordered</span>':'<span class="tag">Lead</span>')+'</div>'
     +'<div class="mute">'+esc(l.company||'')+(l.city?' · '+esc(l.city):'')+'</div>'
     +(l.phone?'<div><a href="tel:'+esc(l.phone)+'" style="color:var(--brand)">'+esc(l.phone)+'</a></div>':'')
     +'<div class="mute">'+esc(expo(l.expo).name)+(l.interest?' · '+esc(l.interest):'')+'</div>'+(l.notes?'<div style="margin-top:4px">'+esc(l.notes)+'</div>':'')
     +'<div class="acts"><button class="b" onclick="addOrder(null,\''+l.id+'\')">Create order</button><button class="g" onclick="addLead(S.leads.find(function(x){return x.id==\''+l.id+'\'}))">Edit</button><button class="g" onclick="del(\'leads\',\''+l.id+'\',\'Delete this lead and its orders?\')">Delete</button></div></div>';
  });
  return h;
}

function orders(){
  var list=S.orders.filter(function(o){return!fExpo||lead(o.lead).expo==fExpo});
  var h='<h1>Orders</h1><p class="sub">Price, transport and delivery to end consumer</p>'+(S.expos.length?expoFilter():'')+'<div class="acts" style="margin:0 0 12px"><button class="b" onclick="addOrder()">New order</button></div>';
  if(!list.length)return h+'<div class="empty">No orders yet. Create one from a lead once the price is agreed.</div>';
  list.slice().reverse().forEach(function(o){
    var l=lead(o.lead),t=o.tr||{},disc=o.list?Math.round((1-o.price/o.list)*100):0,done=o.stage==5;
    h+='<div class="card"><div class="row"><b>'+esc(o.product)+'</b><b>'+inr(total(o))+'</b></div>'
     +'<div class="mute">'+esc(l.name)+(l.company?' – '+esc(l.company):'')+' · '+esc(expo(l.expo).name)+'</div>'
     +'<div class="mute">'+o.qty+' × '+inr(o.price)+(o.list?' (list '+inr(o.list)+', '+(disc>0?disc+'% off':'at list')+')':'')+(o.terms?' · '+esc(o.terms):'')+'</div>'
     +'<div class="steps">'+STAGES.map(function(s,i){return'<i class="'+(i<o.stage||done?'d':i==o.stage?'c':'')+'"></i>'}).join('')+'</div>'
     +'<div class="row"><span class="tag '+(done?'k':'o')+'">'+STAGES[o.stage]+'</span><span class="mute">'+o.log[o.log.length-1].d+'</span></div>'
     +((t.carrier||t.lr)?'<div class="mute" style="margin-top:6px">'+esc(t.carrier||'')+(t.lr?' · LR '+esc(t.lr):'')+(t.vehicle?' · '+esc(t.vehicle):'')+(t.eta?'<br>ETA '+esc(t.eta):'')+(t.consumer?'<br>End consumer: '+esc(t.consumer):'')+'</div>':(o.dest?'<div class="mute" style="margin-top:6px">To '+esc(o.dest)+'</div>':''))
     +'<div class="acts">'+(done?'':'<button class="b" onclick="advance(\''+o.id+'\')">Mark '+STAGES[o.stage+1].toLowerCase()+'</button>')
     +'<button class="g" onclick="transport(S.orders.find(function(x){return x.id==\''+o.id+'\'}))">Transport</button>'
     +'<button class="g" onclick="addOrder(S.orders.find(function(x){return x.id==\''+o.id+'\'}))">Edit</button>'
     +(o.stage?'<button class="g" onclick="back(\''+o.id+'\')">Undo stage</button>':'')
     +'<button class="g" onclick="del(\'orders\',\''+o.id+'\',\'Delete this order?\')">Delete</button></div></div>';
  });
  return h;
}

function render(){
  $('app').innerHTML='<div class="mute" style="text-align:right">● '+esc(mode)+(db?' · <a href="#" onclick="signOut();return false" style="color:var(--brand)">Sign out</a>':'')+'</div>'+(tab=='dash'?dash():tab=='leads'?leads():orders());
  $('nav').innerHTML=[['dash','Overview'],['leads','Leads'],['orders','Orders']].map(function(t){return'<button class="'+(tab==t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';render();scrollTo(0,0)">'+t[1]+'</button>'}).join('');
}
render();init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
